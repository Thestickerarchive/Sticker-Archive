<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Sticker Archive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#15141a;--panel:#1e1d25;--line:#2f2d3a;--text:#ece9f2;--muted:#9b97a8;--hot:#ff5c9d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Helvetica",sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.logo span{color:var(--hot)}
nav{display:flex;gap:20px}
nav a{color:var(--muted)}
nav a.on,nav a:hover{color:var(--text)}
h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;letter-spacing:-.03em;font-weight:800;margin:36px 0 10px;max-width:14em}
.lede{color:var(--muted);max-width:34em;margin:0 0 24px}
.search{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:1.05rem}
.search::placeholder{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent}
.chip small{color:var(--muted);margin-left:6px}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--hot);border-color:var(--hot);color:#1a0a12;font-weight:600}
.chip.on small{color:#1a0a12}
.active{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;color:var(--muted)}
.clear{background:none;border:0;color:var(--hot);padding:0;text-decoration:underline}
.count{color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:26px 22px;padding-bottom:60px}
.card{display:block}
.ph{background:#fff;border-radius:14px;aspect-ratio:1;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .15s}
.card:nth-child(3n+1) .ph{transform:rotate(-1.6deg)}
.card:nth-child(3n+2) .ph{transform:rotate(1.2deg)}
.card:nth-child(3n) .ph{transform:rotate(-.4deg)}
.card:hover .ph{transform:rotate(0) scale(1.03)}
.ph img{display:block;width:100%;height:100%;object-fit:contain}
.ph svg{display:block;width:100%;height:100%}
.cap{padding:12px 4px 0}
.cap b{display:block;font-weight:600}
.cap span{color:var(--muted);font-size:.9rem}
.empty{padding:40px 0;color:var(--muted)}
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;padding:32px 0 40px}
.detail .ph{border-radius:18px;transform:rotate(-1deg)}
.detail h1{margin-top:0;font-size:clamp(1.8rem,4vw,2.8rem)}
dl{margin:20px 0;display:grid;grid-template-columns:auto 1fr;gap:10px 20px}
dt{color:var(--muted)}
dd{margin:0}
dd a{text-decoration:underline;text-decoration-color:var(--hot);text-underline-offset:3px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.back{display:inline-block;margin-top:24px;color:var(--muted)}
h2{font-size:1.3rem;margin:10px 0 18px}
.artists a.row{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.artists a.row:hover b{color:var(--hot)}
.artists span{color:var(--muted)}
.about{max-width:38em;padding-bottom:60px;font-size:1.1rem}
.about p{margin:0 0 1em}
.searchbox{position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.5);max-height:60vh;overflow:auto}
.sug[hidden]{display:none}
.sh{color:var(--muted);font-size:.85rem;padding:8px 10px 4px}
.si{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px}
.si:hover,.si:focus-visible{background:var(--line)}
.si small{color:var(--muted)}
.sn{padding:12px;color:var(--muted)}
.cat{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:11px 10px;border-radius:8px;font-weight:600}
.cat:hover,.cat:focus-visible{background:var(--line)}
.cat small{color:var(--muted);font-weight:400}
.mini{display:block;width:calc(100% - 20px);margin:4px 10px 8px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
footer{border-top:1px solid var(--line);color:var(--muted);padding:22px 0 40px;font-size:.9rem}
@media(max-width:720px){.detail{grid-template-columns:1fr;gap:24px}}
@media(prefers-reduced-motion:reduce){.ph{transition:none}}
</style>
</head>
<body>
<header><div class="wrap">
<a class="logo" href="#/">Street Sticker <span>Archive</span></a>
<nav><a id="n1" href="#/">Archive</a><a id="n2" href="#/artists">Artists</a><a id="n3" href="#/about">About</a><a id="n4" href="#/random">Random</a></nav>
</div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">Street stickers, photographed and filed.</div></footer>
<script>
var S=[],GENRES=[];
var F={q:"",genre:"",tag:"",artist:""};
var app=document.getElementById("app");

function placeholder(s){
  var r=s.id*7919+13,P=["#e63946","#2a6fdb","#f4a261","#2a9d8f","#111111","#8338ec","#ffbe0b"];
  function rnd(){r=(r*16807)%2147483647;return r/2147483647}
  var o='<svg viewBox="0 0 200 200" role="img" aria-label="Sticker '+s.no+'"><rect width="200" height="200" fill="#fff"/>';
  for(var i=0;i<5;i++){
    var c=P[Math.floor(rnd()*P.length)],x=30+rnd()*140,y=30+rnd()*140,z=18+rnd()*40;
    o+=rnd()>.5?'<circle cx="'+x+'" cy="'+y+'" r="'+z/1.6+'" fill="'+c+'"/>':'<rect x="'+(x-z/2)+'" y="'+(y-z/2)+'" width="'+z+'" height="'+z+'" rx="6" fill="'+c+'" transform="rotate('+Math.floor(rnd()*60-30)+' '+x+' '+y+')"/>';
  }
  var ini=s.no;
  return o+'<text x="100" y="118" text-anchor="middle" font-size="44" font-weight="800" fill="#111" stroke="#fff" stroke-width="6" paint-order="stroke" font-family="Bricolage Grotesque,system-ui,sans-serif">'+ini+'</text></svg>';
}
function art(s){return s.photo?'<img src="images/'+encodeURI(s.photo)+'" alt="Sticker '+s.no+'" loading="lazy">':placeholder(s)}
function parseCSV(t){var rows=[],r=[],c="",q=false;t=t.replace(/^\uFEFF/,"");
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==","){r.push(c);c=""}
    else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";if(r.join("")!=="")rows.push(r);r=[]}
    else c+=ch}
  if(c!==""||r.length){r.push(c);rows.push(r)}
  var head=rows.shift().map(function(x){return x.trim().toLowerCase()});
  return rows.map(function(v,n){var o={};head.forEach(function(k,i){o[k]=(v[i]||"").trim()});
    return {id:n+1,no:o.no||("000"+(n+1)).slice(-4),artist:o.artist||"Unknown",genre:o.genre||"Other",
      tags:o.tags?o.tags.split(";").map(function(x){return x.trim()}).filter(Boolean):[],
      loc:o.location,date:o.date,desc:o.description,notes:o.notes,photo:o.photo}})}
function fmt(d){if(!d)return "Unknown";return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function card(s){return '<a class="card" href="#/s/'+s.no+'"><div class="ph">'+art(s)+'</div><div class="cap"><b>'+s.no+'</b><span>'+s.artist+'</span></div></a>'}
function match(s,skip){
  var q=F.q.trim().toLowerCase();
  if(skip!=="genre"&&F.genre&&s.genre!==F.genre)return false;
  if(F.tag&&s.tags.indexOf(F.tag)<0)return false;
  if(F.artist&&s.artist!==F.artist)return false;
  if(q&&[s.no,s.desc,s.artist,s.genre,s.loc,s.tags.join(" ")].join(" ").toLowerCase().indexOf(q)<0)return false;
  return true;
}
function update(){
  var list=S.filter(function(s){return match(s)});
  var chips=GENRES.map(function(g){
    var n=S.filter(function(s){return s.genre===g&&match(s,"genre")}).length;
    return '<button class="chip'+(F.genre===g?" on":"")+'" data-genre="'+g+'">'+g+'<small>'+n+'</small></button>';
  }).join("");
  var act="";
  if(F.tag)act+='<span>Style: <b>'+F.tag+'</b></span>';
  if(F.artist)act+='<span>Artist: <b>'+F.artist+'</b></span>';
  if(act||F.genre||F.q)act+='<button class="clear" data-clear="1">Clear all filters</button>';
  document.getElementById("chips").innerHTML=chips;
  document.getElementById("active").innerHTML=act;
  document.getElementById("count").textContent=list.length+(list.length===1?" sticker":" stickers");
  document.getElementById("grid").innerHTML=list.length?list.map(card).join(""):'<p class="empty">No stickers match these filters. Try removing a tag or clearing the search.</p>';
}
function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
var OPEN="",MINI={genre:"",tag:""};
function allOf(get){var m={};S.forEach(function(s){(get==="tags"?s.tags:[s[get]]).forEach(function(v){if(v)m[v]=(m[v]||0)+1})});
  return Object.keys(m).sort(function(a,b){return m[b]-m[a]||a.localeCompare(b)}).map(function(k){return{v:k,n:m[k]}})}
function rows(key){
  var t=MINI[key].toLowerCase(),l=allOf(key==="tag"?"tags":"genre").filter(function(x){return x.v.toLowerCase().indexOf(t)>=0});
  return l.length?l.map(function(x){return '<button class="si" data-pick="'+key+'" data-v="'+esc(x.v)+'">'+esc(x.v)+'<small>'+x.n+'</small></button>'}).join(""):'<div class="sn">Nothing matches that.</div>';
}
function cats(){
  var box=document.getElementById("sug");if(!box)return;
  function sect(label,key){var on=OPEN===key,lc=label.toLowerCase();
    return '<button class="cat" data-cat="'+key+'" aria-expanded="'+on+'">'+label+'<small>'+(on?"Hide":"Show all")+'</small></button>'+
    (on?'<input class="mini" data-mini="'+key+'" type="search" autocomplete="off" placeholder="Filter '+lc+'" aria-label="Filter '+lc+'" value="'+esc(MINI[key])+'"><div id="rows-'+key+'">'+rows(key)+'</div>':"")}
  box.innerHTML=sect("Genres","genre")+sect("Styles","tag")+'<a class="cat" href="#/artists">Artists<small>Browse</small></a>';
  box.hidden=false;
}
document.addEventListener("input",function(e){
  var m=e.target.closest&&e.target.closest("[data-mini]");
  if(m){MINI[m.dataset.mini]=m.value;document.getElementById("rows-"+m.dataset.mini).innerHTML=rows(m.dataset.mini)}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){var b=document.getElementById("sug");if(b)b.hidden=true}});
function suggest(){
  var box=document.getElementById("sug"),q=F.q.trim().toLowerCase();
  if(!box)return;
  if(!q){cats();return}
  function find(get){var m={};S.forEach(function(s){(get==="tags"?s.tags:[s[get]]).forEach(function(v){if(v)m[v]=(m[v]||0)+1})});
    return Object.keys(m).filter(function(k){return k.toLowerCase().indexOf(q)>=0}).sort(function(a,b){return m[b]-m[a]}).slice(0,5).map(function(k){return{v:k,n:m[k]}})}
  var G=[["Artists","artist",find("artist")],["Genres","genre",find("genre")],["Styles","tag",find("tags")]];
  var out=G.map(function(g){return g[2].length?'<div class="sg"><div class="sh">'+g[0]+'</div>'+g[2].map(function(x){return '<button class="si" data-pick="'+g[1]+'" data-v="'+esc(x.v)+'">'+esc(x.v)+'<small>'+x.n+'</small></button>'}).join("")+'</div>':""}).join("");
  box.innerHTML=out||'<div class="sn">No artists, genres or styles match. The stickers below still search every other detail.</div>';
  box.hidden=false;
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-pick]"),box=document.getElementById("sug"),c=e.target.closest("[data-cat]");
  if(c){OPEN=OPEN===c.dataset.cat?"":c.dataset.cat;cats();var mi=box.querySelector("[data-mini]");if(mi)mi.focus();return}
  if(b){OPEN="";MINI={genre:"",tag:""};F.q="";var qi=document.getElementById("q");if(qi)qi.value="";F[b.dataset.pick]=b.dataset.v;box.hidden=true;update();return}
  if(box&&!e.target.closest(".searchbox"))box.hidden=true;
});
function gallery(){
  app.innerHTML='<h1>Stickers found on the street</h1>'+
  '<div class="searchbox"><input class="search" id="q" type="search" placeholder="Search artists, genres, styles or places" aria-label="Search" autocomplete="off" value="'+F.q.replace(/"/g,"&quot;")+'"><div class="sug" id="sug" hidden></div></div>'+
  '<div class="chips" id="chips"></div><div class="active" id="active"></div><p class="count" id="count"></p><div class="grid" id="grid"></div>';
  var qi=document.getElementById("q");
  qi.addEventListener("input",function(e){F.q=e.target.value;update();suggest()});
  qi.addEventListener("focus",suggest);
  qi.addEventListener("click",suggest);
  qi.addEventListener("keydown",function(e){if(e.key==="Escape")document.getElementById("sug").hidden=true;if(e.key==="Enter"&&!qi.value.trim())cats()});
  update();
}
function detail(id){
  var s=S.filter(function(x){return x.no===id})[0];
  if(!s){app.innerHTML='<p class="empty">That sticker is not in the archive. <a class="back" href="#/">Back to the archive</a></p>';return}
  var more=S.filter(function(x){return x.artist===s.artist&&x.id!==s.id}).slice(0,4);
  app.innerHTML='<div class="detail"><div class="ph">'+art(s)+'</div><div><h1>'+s.no+'</h1>'+(s.desc?'<p class="lede">'+s.desc+'</p>':'')+
  '<dl><dt>Artist</dt><dd><a href="#/" data-artist="'+s.artist+'">'+s.artist+'</a></dd><dt>Genre</dt><dd><a href="#/" data-genre="'+s.genre+'">'+s.genre+'</a></dd>'+
  '<dt>Found</dt><dd>'+s.loc+'</dd><dt>Date</dt><dd>'+fmt(s.date)+'</dd></dl>'+
  '<div class="tags">'+s.tags.map(function(t){return '<button class="chip" data-tag="'+t+'">'+t+'</button>'}).join("")+'</div>'+
  '<p>'+s.notes+'</p><a class="back" href="#/">Back to the archive</a><a class="back" href="#/random" style="margin-left:20px">Another random sticker</a></div></div>'+
  (more.length?'<h2>More by '+s.artist+'</h2><div class="grid">'+more.map(card).join("")+'</div>':"");
}
function artists(){
  var m={};S.forEach(function(s){(m[s.artist]=m[s.artist]||[]).push(s)});
  var rows=Object.keys(m).sort().map(function(a){
    var g=m[a].map(function(s){return s.genre}).filter(function(v,i,x){return x.indexOf(v)===i}).join(", ");
    return '<a class="row" href="#/" data-artist="'+a+'"><b>'+a+'</b><span>'+m[a].length+(m[a].length===1?" sticker":" stickers")+" in "+g+'</span></a>';
  }).join("");
  app.innerHTML='<h1>Artists and crews</h1><p class="lede">Everyone with at least one sticker in the archive.</p><div class="artists" style="padding-bottom:60px">'+rows+'</div>';
}
var LASTR="";
function about(){
  app.innerHTML='<h1>About</h1><div class="about" id="about"><p class="empty">Loading…</p></div>';
  fetch("about.txt").then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
    var esc=function(x){return x.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")};
    document.getElementById("about").innerHTML=t.trim().split(/\n\s*\n/).map(function(p){return "<p>"+esc(p).replace(/\n/g,"<br>")+"</p>"}).join("");
  }).catch(function(){document.getElementById("about").innerHTML='<p class="empty">Could not load about.txt. Check it sits next to index.html and is named exactly that.</p>'});
}
function route(){
  var h=location.hash||"#/",m=h.match(/^#\/s\/(\d+)/);
  if(h==="#/random"){
    if(!S.length){location.replace("#/");return}
    var pool=S.filter(function(x){return x.no!==LASTR}),pick=(pool.length?pool:S)[Math.floor(Math.random()*(pool.length||S.length))];
    LASTR=pick.no;location.replace("#/s/"+pick.no);return;
  }
  document.getElementById("n1").className=h==="#/"||m?"on":"";
  document.getElementById("n2").className=h==="#/artists"?"on":"";
  document.getElementById("n3").className=h==="#/about"?"on":"";
  if(m)detail(m[1]);else if(h==="#/artists")artists();else if(h==="#/about")about();else gallery();
  window.scrollTo(0,0);
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-genre],[data-tag],[data-artist],[data-clear]");
  if(!t)return;
  var onHome=location.hash===""||location.hash==="#/";
  if(t.dataset.clear){F={q:"",genre:"",tag:"",artist:""};if(onHome){gallery()}else{location.hash="#/"}return}
  if(t.dataset.genre!==undefined)F.genre=F.genre===t.dataset.genre&&onHome?"":t.dataset.genre;
  if(t.dataset.tag!==undefined)F.tag=t.dataset.tag;
  if(t.dataset.artist!==undefined)F.artist=t.dataset.artist;
  if(t.tagName==="A")e.preventDefault();
  if(onHome){update()}else{location.hash="#/"}
});
window.addEventListener("hashchange",route);
fetch("stickers.csv").then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
  S=parseCSV(t);var n={};S.forEach(function(s){n[s.genre]=(n[s.genre]||0)+1});
  GENRES=Object.keys(n).sort(function(a,b){return n[b]-n[a]});route();
}).catch(function(){app.innerHTML='<p class="empty">Could not load stickers.csv. Check that it sits next to index.html and is named exactly that.</p>'});
</script>
</body>
</html>
